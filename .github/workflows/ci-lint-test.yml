name: Lint Checks

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ (github.event.pull_request && github.event.pull_request.number) || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generated-files-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Verify Protobuf types are up to date
        run: make proto && { if git status --porcelain | grep '??'; then exit 1; else git diff --name-status --exit-code; fi }

      # proto only generates what this library releases: api_v2 and the prototest fixture.
      # proto-all compiles every definition across languages, which is the only thing that
      # checks the api_v3 and storage/v2 protos at all, and regenerates the committed
      # api_v3 OpenAPI spec so drift in it is caught here rather than downstream.
      - name: Verify all Protobuf definitions compile
        run: make proto-all && { if git status --porcelain | grep '??'; then exit 1; else git diff --name-status --exit-code; fi }

      - name: Verify Thrift types are up to date
        run: make thrift && { if git status --porcelain | grep '??'; then exit 1; else git diff --name-status --exit-code; fi }

  go-mod-tidy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify go.mod files are up to date
        run: |
          go mod tidy && \
          (cd internal/tools && go mod tidy) && \
          { if git status --porcelain | grep '??'; then exit 1; else git diff --name-status --exit-code; fi }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481  # v2.11.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: ./go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Run lint checks
        run: |
          make lint
