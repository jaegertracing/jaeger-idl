syntax = "proto3";

package jaeger.storage.v2;

option go_package = "storage";

// SearchCapabilities describes how faithfully a backend can serve the search RPCs of
// TraceReader: which TraceQueryParameters fields it accepts as empty, and — as fields
// are added here — which it honors exactly rather than approximating. Its zero value is
// the least capable backend, so a field added later leaves existing implementations
// reporting the new capability as unsupported.
message SearchCapabilities {
  // without_service_name is true when FindTraces, FindTraceIDs and FindTraceSummaries
  // accept a query whose service_name is empty and read it as "any service", rather
  // than as an error or an empty result. Backends that index by service name, such as
  // Cassandra, cannot do this.
  bool without_service_name = 1;

  // same_span_conjunction is true when a multi-predicate conjunction — the legacy
  // attributes map, or an `and` in the RFC 0005 filter — is matched within a single
  // span. false means the backend may satisfy different conjuncts from different spans
  // of the same trace, as a flat inverted index intersecting at trace granularity does.
  // It is reported, not enforced: the query service does not refuse a conjunction, it
  // surfaces the looser scoping so a caller that needs strict single-span matching is
  // not surprised by the result.
  bool same_span_conjunction = 2;

  // filter describes structured-filter support (RFC 0005). Its zero value — an absent
  // message — means the backend serves only the legacy predicate fields, so the query
  // service down-converts any filter to service_name / attributes / duration for it.
  FilterCapabilities filter = 3;
}

// FilterCapabilities declares how much of the RFC 0005 structured filter a backend can
// serve. Every field's zero value is the least capable answer, so a backend that leaves
// this message at its defaults accepts only a flat, unqualified conjunction. levels,
// operators and boolean are refusal gates: the query service rejects a predicate that
// names a level, operator or boolean structure not listed here.
message FilterCapabilities {
  // levels lists the attribute levels the backend can filter on
  // (span|resource|instrumentation|event|link). Empty means it cannot serve a
  // level-qualified predicate, so only unqualified (empty-level) filters reach it.
  repeated string levels = 1;

  // operators lists the op values the backend evaluates
  // (eq|ne|gt|lt|gte|lte|regex|exists|in|not_in|some). A predicate whose op is not
  // listed is refused.
  repeated string operators = 2;

  // boolean is true when the backend evaluates or/not and nested groups; false means it
  // accepts only a flat conjunction, the subset the flat backends run.
  bool boolean = 3;
}

// GetCapabilitiesRequest represents a request for the backend's capabilities.
message GetCapabilitiesRequest {}

// GetCapabilitiesResponse represents the capabilities of a storage backend, grouped by
// the concern each set describes rather than as a flat list of flags, so that a later
// addition is a sibling field.
message GetCapabilitiesResponse {
  SearchCapabilities search = 1;
}

// Capabilities reports what a storage backend is able to do, so a caller can avoid
// asking for something it cannot serve — Jaeger's query service passes the answer to
// its UI, which offers a cross-service search only where the backend accepts one.
//
// It is a service of its own rather than a method on TraceReader because what it
// reports is not confined to reading traces: jaeger.storage.v1 reported writer-side
// capabilities through the same mechanism, and a v2 backend may need to report on
// writes or dependencies without those answers arriving through the trace-reading API.
//
// A backend that does not implement this service returns gRPC status UNIMPLEMENTED,
// which the caller reads as "unknown" and treats as the least capable backend. That
// keeps every existing backend working unchanged: registering the service is opt-in,
// and the generated UnimplementedCapabilitiesServer embedding provides the status for a
// backend that registers it without overriding the method.
//
// Capabilities are expected to be stable for the lifetime of a connection, so a caller
// may ask once and cache the answer.
service Capabilities {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse) {}
}
