syntax = "proto3";

package jaeger.expression.v1;

import "gnostic/openapiv3/annotations.proto";

option go_package = "expression";

// The messages below are the structured trace-query filter AST proposed in Jaeger
// RFC 0005, "Structured Query Filters for Trace Search":
// https://github.com/jaegertracing/jaeger/blob/main/docs/rfc/0005-structured-query-filters.md
// Section references (§N) in the comments below point into that document.

// Expression is a node in the filter AST: an atom (one of the three references,
// or a Scalar or List constant) or a Call over argument Expressions.
message Expression {
  option (openapi.v3.schema) = {
    one_of: [
      {schema: {required: ["attr"]}},
      {schema: {required: ["field"]}},
      {schema: {required: ["nested"]}},
      {schema: {required: ["scalar"]}},
      {schema: {required: ["list"]}},
      {schema: {required: ["call"]}}
    ]
  };
  oneof term {
    AttributeReference  attr       = 1;  // an entry in an attribute map, by key
    FieldReference      field      = 2;  // a built-in field of a level (§5.2)
    NestedReference     nested     = 3;  // the nested events or links, for `some` (§5.5)
    Scalar              scalar     = 4;  // a single constant
    List                list       = 5;  // a homogeneous list constant (right arg of in/not_in)
    Call                call       = 6;  // an operator/function over argument Expressions
  }
}

// AttributeReference names an entry in one of the span's attribute maps.
message AttributeReference {
  option (openapi.v3.schema) = {required: ["key"]};

  string key = 1;

  // level says which attribute map to read. Empty means the unqualified
  // span-or-resource search (§5.1), so the empty value is one of the enum's own.
  string level = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "span"}, {yaml: "resource"}, {yaml: "scope"}, {yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// FieldReference names a built-in field — a value the data model defines
// directly rather than an attribute-map entry (§5.2).
message FieldReference {
  option (openapi.v3.schema) = {required: ["name", "level"]};

  // name of a built-in field of `level`, not an arbitrary key (§5.2).
  string name = 1;

  string level = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "span"}, {yaml: "resource"}, {yaml: "scope"}, {yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// NestedReference names a span's events or links collection, which is what `some`
// quantifies over (§5.5).
message NestedReference {
  option (openapi.v3.schema) = {required: ["level"]};

  string level = 1 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// Scalar is a single constant value with an optional type hint.
//
// A duration ("2s") and a timestamp (RFC 3339) have no `type` of their
// own: they travel as an unhinted constant, and the receiving side resolves them
// from the built-in field they are compared against (§5.4).
message Scalar {
  option (openapi.v3.schema) = {required: ["value"]};

  // value is the constant as text, so a duration or a timestamp travels with the
  // unit it is written in (§5.4).
  string value = 1;

  // type is OPTIONAL; empty means any type, a set type is authoritative (§5.4), so the empty
  // value is one of the enum's own.
  string type = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "string"}, {yaml: "int"}, {yaml: "double"}, {yaml: "bool"}]
    }
  ];
}

// List is a homogeneous list constant, the right arg of in/not_in. Every element is read as one
// type, and that type comes from one of two places: either the type field below declares it, or the
// built-in field the list is compared against supplies it. Compared against an attribute neither
// place has a type to give, so the elements are matched at whatever type they were stored, the same
// way an untyped scalar beside an attribute is matched (§5.4).
message List {
  option (openapi.v3.schema) = {required: ["values"]};

  // values must have at least one element: membership in nothing matches nothing.
  repeated string values = 1 [(openapi.v3.property) = {min_items: 1}];

  // type is the type every element is read as, and a list matches only values of that type. It is
  // OPTIONAL. Left empty, it means one of two things: the built-in field the list is compared
  // against supplies the type, or the list sits beside an attribute, where nothing supplies one and
  // the elements are under no type constraint at all (see Scalar.type).
  string type = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "string"}, {yaml: "int"}, {yaml: "double"}, {yaml: "bool"}]
    }
  ];
}

// Call applies operator/function `op` to argument Expressions. Arity follows the
// operator: unary for not/exists, binary for the comparisons and in/not_in,
// n-ary for and/or. `some` is an event/link existential; its args are a
// NestedReference and the Call evaluated against each element (§5.5).
message Call {
  option (openapi.v3.schema) = {required: ["op", "args"]};

  string op = 1 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "and"}, {yaml: "or"}, {yaml: "not"}, {yaml: "eq"}, {yaml: "ne"}, {yaml: "gt"}, {yaml: "lt"}, {yaml: "gte"}, {yaml: "lte"}, {yaml: "regex"}, {yaml: "exists"}, {yaml: "in"}, {yaml: "not_in"}, {yaml: "some"}]
    }
  ];

  // args are the operands, and how many an operator takes is a property of op.
  repeated Expression args = 2;
}
