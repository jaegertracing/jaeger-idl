syntax = "proto3";

package jaeger.expression.v1;

import "gnostic/openapiv3/annotations.proto";

option go_package = "expression";

// The messages below are the structured trace-query filter AST proposed in Jaeger
// RFC 0005, "Structured Query Filters for Trace Search":
// https://github.com/jaegertracing/jaeger/blob/main/docs/rfc/0005-structured-query-filters.md
// Section references (§N) in the comments below point into that document.

// Expression is a node in the filter AST: an atom (one of the three references,
// or a Scalar or List constant) or a Call over argument Expressions.
message Expression {
  option (openapi.v3.schema) = {
    one_of: [
      {schema: {required: ["attr"]}},
      {schema: {required: ["field"]}},
      {schema: {required: ["nested"]}},
      {schema: {required: ["scalar"]}},
      {schema: {required: ["list"]}},
      {schema: {required: ["call"]}}
    ]
  };
  oneof term {
    AttributeReference  attr       = 1;  // an entry in an attribute map, by key
    FieldReference      field      = 2;  // a built-in field of a level (§5.2)
    NestedReference     nested     = 3;  // the nested events or links, for `some` (§5.5)
    Scalar              scalar     = 4;  // a single constant
    List                list       = 5;  // a homogeneous list constant, the right arg of the operators that take one
    Call                call       = 6;  // an operator/function over argument Expressions
  }
}

// AttributeReference names an entry in one of the span's attribute maps.
message AttributeReference {
  option (openapi.v3.schema) = {required: ["key"]};

  string key = 1;

  // level says which attribute map to read. Empty means the unqualified
  // span-or-resource search (§5.1), so the empty value is one of the enum's own.
  string level = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "span"}, {yaml: "resource"}, {yaml: "scope"}, {yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// FieldReference names a built-in field — a value the data model defines
// directly rather than an attribute-map entry (§5.2).
message FieldReference {
  option (openapi.v3.schema) = {required: ["name", "level"]};

  // name of a built-in field of `level`, not an arbitrary key (§5.2).
  string name = 1;

  string level = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "span"}, {yaml: "resource"}, {yaml: "scope"}, {yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// NestedReference names a span's events or links collection, which is what `some`
// quantifies over (§5.5).
message NestedReference {
  option (openapi.v3.schema) = {required: ["level"]};

  string level = 1 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// Scalar is a single constant value with an optional type hint.
//
// A duration ("2s") and a timestamp (RFC 3339) have no `type` of their
// own: they travel as an unhinted constant, and the receiving side resolves them
// from the built-in field they are compared against (§5.4).
message Scalar {
  option (openapi.v3.schema) = {required: ["value"]};

  // value is the constant as text, so a duration or a timestamp travels with the
  // unit it is written in (§5.4).
  string value = 1;

  // type is OPTIONAL; empty means any type, a set type is authoritative (§5.4), so the empty
  // value is one of the enum's own.
  string type = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "string"}, {yaml: "int"}, {yaml: "double"}, {yaml: "bool"}]
    }
  ];
}

// List is a homogeneous list constant, the right arg of the operators that take one (Call.op).
// Every element is read as one type, and that type comes from one of two places: either the type field below declares it, or the
// built-in field the list is compared against supplies it. Compared against an attribute neither
// place has a type to give, so the elements are matched at whatever type they were stored, the same
// way an untyped scalar beside an attribute is matched (§5.4).
message List {
  option (openapi.v3.schema) = {required: ["values"]};

  // values must have at least one element: membership in nothing matches nothing.
  repeated string values = 1 [(openapi.v3.property) = {min_items: 1}];

  // type is the type every element is read as, and a list matches only values of that type. It is
  // OPTIONAL. Left empty, it means one of two things: the built-in field the list is compared
  // against supplies the type, or the list sits beside an attribute, where nothing supplies one and
  // the elements are under no type constraint at all (see Scalar.type).
  string type = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "string"}, {yaml: "int"}, {yaml: "double"}, {yaml: "bool"}]
    }
  ];
}

// Call applies operator/function `op` to argument Expressions. The arity and the operands
// follow the operator, as the comment on `op` defines (§5.3, §5.5).
message Call {
  option (openapi.v3.schema) = {required: ["op", "args"]};

  // op names the operator. Each operator's definition below states what operands it takes and
  // what it asks of the span. A definition states what every backend must do, and where it says
  // a point is backend-specific, backends may differ there: a text search on one backend may stem
  // words that another matches literally, and both conform. A backend that cannot meet the
  // required part of a definition leaves the operator out of the operators it declares
  // (storage/v2 FilterCapabilities), and the query service refuses a filter that uses it before
  // the backend sees it. The declaration is coarse, so a backend that serves an operator on some
  // fields or under some configuration only declares it and refuses the predicates it cannot
  // serve. What no backend does is answer an approximation.
  //
  // Two rules hold for every leaf operator, which is every operator but and, or and not. A leaf
  // over a reference that holds no value is false, so ne and not_in do not match a span that
  // lacks the attribute, and only not flips that. When a reference resolves to several values, as
  // an unqualified attribute recorded at more than one level does, a positive leaf holds when one
  // of the values satisfies it, and a negated leaf holds when none of them does.
  //
  // - and: two or more predicates; holds when every one of them holds.
  // - or: two or more predicates; holds when at least one of them holds.
  // - not: one predicate; holds when it does not.
  // - eq: two operands holding the same kind of value (a number, a duration, an instant, text, a
  //   boolean); holds when the two values are equal. Either operand may be a reference or a
  //   constant; an attribute or an untyped constant takes its kind from the other operand.
  // - ne: the operands eq takes; holds when the two values are not equal.
  // - gt, lt, gte, lte: two operands holding the same kind of value, which has an order; hold
  //   when the first exceeds, sorts before, equals or exceeds, or equals or sorts before the
  //   second. The comparison runs within one domain: numbers against numbers, durations against
  //   durations, instants against instants, and text against text lexicographically. A boolean
  //   and the word-valued fields span.status and span.kind have no order, so an ordered
  //   comparison over them is refused.
  // - regex: a reference that holds text (a string field, a word-valued field, or an attribute)
  //   and a constant string pattern in RE2 syntax; holds when the pattern matches anywhere in the
  //   value, case-sensitively. Anchors, word boundaries, lazy quantifiers and inline case-folding
  //   flags are refused, because the backends' engines do not share them.
  // - exists: one attribute or field reference; holds when the value is present at all.
  // - in: a reference and a non-empty List; holds when the value is one of the list's elements.
  // - not_in: the operands in takes; holds when the value is none of the elements.
  // - some: a NestedReference naming a span's events or links and a predicate; holds when one
  //   element of that collection satisfies the predicate. Inside the predicate, references to the
  //   collection's level bind to that same element (§5.5).
  // - phrase: an AttributeReference and a non-empty List of words; holds when the attribute's
  //   value contains every listed word the backend's analyzer keeps, adjacent and in the listed
  //   order, the way a quoted web search does.
  // - fulltext: an AttributeReference and a non-empty List of words; holds when the attribute's
  //   value contains every listed word the backend's analyzer keeps, in any order.
  //
  // phrase and fulltext share one contract. They match words, not characters: the backend splits
  // the stored value into words, at least on ASCII whitespace, ignores ASCII case, and asks
  // whether the listed words occur among them. The subject is an attribute only, since a built-in
  // field is a short identifier that eq and regex already search. The list is of strings,
  // declared or undeclared, with one word per element: a non-empty run of Unicode letters,
  // combining marks and digits of at most 255 UTF-16 code units. The caller splits the words, so
  // no element is a search string with syntax of its own. Everything beyond that is
  // backend-specific: punctuation between words, case folding and word boundaries beyond ASCII,
  // splitting of long stored words, stemming, and stop-word removal. A listed word the backend's
  // analyzer drops constrains nothing under fulltext; under phrase, whether its position must be
  // empty or may hold any one word is backend-specific. See RFC 0005 §5.3, "Text search".
  string op = 1 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "and"}, {yaml: "or"}, {yaml: "not"}, {yaml: "eq"}, {yaml: "ne"}, {yaml: "gt"}, {yaml: "lt"}, {yaml: "gte"}, {yaml: "lte"}, {yaml: "regex"}, {yaml: "exists"}, {yaml: "in"}, {yaml: "not_in"}, {yaml: "some"}, {yaml: "phrase"}, {yaml: "fulltext"}]
    }
  ];

  // args are the operands, and how many an operator takes is a property of op.
  repeated Expression args = 2;
}
