syntax = "proto3";

package jaeger.expression.v1;

import "gnostic/openapiv3/annotations.proto";
import "expression/v1/vocabulary.proto";

option go_package = "expression";

// The messages below are the structured trace-query filter AST proposed in Jaeger
// RFC 0005, "Structured Query Filters for Trace Search":
// https://github.com/jaegertracing/jaeger/blob/main/docs/rfc/0005-structured-query-filters.md
// Section references (§N) in the comments below point into that document.

// Expression is a node in the filter AST: an atom (one of the three references,
// or a Scalar or List constant) or a Call over argument Expressions.
message Expression {
  option (openapi.v3.schema) = {
    one_of: [
      {schema: {required: ["attr"]}},
      {schema: {required: ["field"]}},
      {schema: {required: ["nested"]}},
      {schema: {required: ["scalar"]}},
      {schema: {required: ["list"]}},
      {schema: {required: ["call"]}}
    ]
  };
  oneof term {
    AttributeReference  attr       = 1;  // an entry in an attribute map, by key
    FieldReference      field      = 2;  // a built-in field of a level (§5.2)
    NestedReference     nested     = 3;  // the nested events or links, for `some` (§5.5)
    Scalar              scalar     = 4;  // a single constant
    List                list       = 5;  // a homogeneous list constant, the right arg of a membership or text-search operator
    Call                call       = 6;  // an operator/function over argument Expressions
  }
}

// AttributeReference names an entry in one of the span's attribute maps.
message AttributeReference {
  option (openapi.v3.schema) = {required: ["key"]};

  string key = 1;

  // level says which attribute map to read. Empty means the unqualified
  // span-or-resource search (§5.1), so the empty value is one of the enum's own.
  string level = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "span"}, {yaml: "resource"}, {yaml: "scope"}, {yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// FieldReference names a built-in field — a value the data model defines
// directly rather than an attribute-map entry (§5.2).
message FieldReference {
  option (openapi.v3.schema) = {required: ["name", "level"]};

  // name of a built-in field of `level`, not an arbitrary key (§5.2).
  string name = 1;

  string level = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "span"}, {yaml: "resource"}, {yaml: "scope"}, {yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// NestedReference names a span's events or links collection, which is what `some`
// quantifies over (§5.5).
message NestedReference {
  option (openapi.v3.schema) = {required: ["level"]};

  string level = 1 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "event"}, {yaml: "link"}]
    }
  ];
}

// Scalar is a single constant value with an optional type hint.
//
// A duration ("2s") and a timestamp (RFC 3339) have no `type` of their
// own: they travel as an unhinted constant, and the receiving side resolves them
// from the built-in field they are compared against (§5.4).
message Scalar {
  option (openapi.v3.schema) = {required: ["value"]};

  // value is the constant as text, so a duration or a timestamp travels with the
  // unit it is written in (§5.4).
  string value = 1;

  // type is OPTIONAL; empty means any type, a set type is authoritative (§5.4), so the empty
  // value is one of the enum's own.
  string type = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "string"}, {yaml: "int"}, {yaml: "double"}, {yaml: "bool"}]
    }
  ];
}

// List is a homogeneous list constant, the right arg of a membership or text-search operator (see
// the comment on the `op` field of Call). Every element is read as one type, and that type comes
// from one of three places: the type field below declares it, the built-in field the list is
// compared against supplies it, or the operator fixes it, as the text-search operators fix it to
// string. Compared against an attribute by a membership operator, no place has a type to give, so
// the elements are matched at whatever type they were stored, the same way an untyped scalar
// beside an attribute is matched (§5.4).
message List {
  option (openapi.v3.schema) = {required: ["values"]};

  // values must have at least one element: membership in nothing matches nothing.
  repeated string values = 1 [(openapi.v3.property) = {min_items: 1}];

  // type is the type every element is read as, and a list matches only values of that type. It is
  // OPTIONAL. Left empty, it means one of two things: the built-in field the list is compared
  // against supplies the type, or the list sits beside an attribute, where nothing supplies one and
  // the elements are under no type constraint at all (see Scalar.type).
  string type = 2 [
    (openapi.v3.property) = {
      type: "string",
      enum: [{yaml: "''"}, {yaml: "string"}, {yaml: "int"}, {yaml: "double"}, {yaml: "bool"}]
    }
  ];
}

// Call applies operator/function `op` to argument Expressions. The arity and the operands
// follow the operator, as the definitions on the `op` field state.
message Call {
  option (openapi.v3.schema) = {required: ["op", "args"]};

  // op names one of the operators listed after this text, each with the operands it takes and
  // what it asks of the span.
  //
  // Two rules hold for every leaf operator, except `and`, `or` and `not`. A leaf over a
  // reference that holds no value is false, so `ne` and `not_in` do not match a span that lacks
  // the attribute, and only `not` flips that. When a reference resolves to several values, as
  // an unqualified attribute recorded at more than one level does, a positive leaf holds when one
  // of the values satisfies it, and a negated leaf holds when none of them does.
  string op = 1 [
    (jaeger.expression.v1.operators) = {
      name: "and"
      arity: ARITY_VARIADIC
      operands: [OPERAND_PREDICATE]
      description: "Holds when every one of the predicates holds."
    },
    (jaeger.expression.v1.operators) = {
      name: "or"
      arity: ARITY_VARIADIC
      operands: [OPERAND_PREDICATE]
      description: "Holds when at least one of the predicates holds."
    },
    (jaeger.expression.v1.operators) = {
      name: "not"
      arity: ARITY_UNARY
      operands: [OPERAND_PREDICATE]
      description: "Holds when the predicate does not."
    },
    (jaeger.expression.v1.operators) = {
      name: "eq"
      arity: ARITY_BINARY
      operands: [OPERAND_VALUE, OPERAND_VALUE]
      description:
        "Holds when the two values are equal. Both operands hold the same kind of value (a "
        "number, a duration, an instant, text, a boolean); an attribute or an untyped constant "
        "takes its kind from the other operand."
    },
    (jaeger.expression.v1.operators) = {
      name: "ne"
      arity: ARITY_BINARY
      operands: [OPERAND_VALUE, OPERAND_VALUE]
      description: "Holds when the two values are not equal. Takes the same operands as `eq`."
    },
    (jaeger.expression.v1.operators) = {
      name: "gt"
      arity: ARITY_BINARY
      operands: [OPERAND_VALUE, OPERAND_VALUE]
      description:
        "Holds when the first value exceeds the second. Both operands hold the same kind of "
        "value, which has an order, and the comparison runs within one domain: numbers against "
        "numbers, durations against durations, instants against instants, and text against text "
        "lexicographically. A boolean and the word-valued fields `span.status` and `span.kind` have "
        "no order, so an ordered comparison over them is refused."
    },
    (jaeger.expression.v1.operators) = {
      name: "lt"
      arity: ARITY_BINARY
      operands: [OPERAND_VALUE, OPERAND_VALUE]
      description: "Holds when the first value sorts before the second. Takes the same operands as `gt`."
    },
    (jaeger.expression.v1.operators) = {
      name: "gte"
      arity: ARITY_BINARY
      operands: [OPERAND_VALUE, OPERAND_VALUE]
      description: "Holds when the first value equals or exceeds the second. Takes the same operands as `gt`."
    },
    (jaeger.expression.v1.operators) = {
      name: "lte"
      arity: ARITY_BINARY
      operands: [OPERAND_VALUE, OPERAND_VALUE]
      description: "Holds when the first value equals or sorts before the second. Takes the same operands as `gt`."
    },
    (jaeger.expression.v1.operators) = {
      name: "regex"
      arity: ARITY_BINARY
      operands: [OPERAND_REFERENCE, OPERAND_CONSTANT]
      description:
        "Holds when the pattern matches anywhere in the value, case-sensitively. The reference "
        "holds text (a string field, a word-valued field, or an attribute) and the constant is a "
        "string pattern in RE2 syntax. Anchors, word boundaries, lazy quantifiers and inline "
        "case-folding flags are refused, because the backends' engines do not share them."
    },
    (jaeger.expression.v1.operators) = {
      name: "exists"
      arity: ARITY_UNARY
      operands: [OPERAND_REFERENCE]
      description:
        "Holds when the span carries the referenced attribute or built-in field. An attribute is "
        "carried when the attribute map at the referenced level has the key, even with the empty "
        "string as the value. An optional built-in field such as `span.parentSpanID` or "
        "`span.statusMessage` is carried when the span sets it, so one left at its OTLP zero value "
        "is not. An event or link field is carried when the span has at least one event or link. A "
        "field every span carries, such as `span.name` or `span.traceID`, is always present, so a "
        "backend may refuse `exists` on it rather than evaluate a predicate that holds for every "
        "span."
    },
    (jaeger.expression.v1.operators) = {
      name: "in"
      arity: ARITY_BINARY
      operands: [OPERAND_REFERENCE, OPERAND_LIST]
      description: "Holds when the value is one of the elements of the non-empty list."
    },
    (jaeger.expression.v1.operators) = {
      name: "not_in"
      arity: ARITY_BINARY
      operands: [OPERAND_REFERENCE, OPERAND_LIST]
      description: "Holds when the value is none of the elements. Takes the same operands as `in`."
    },
    (jaeger.expression.v1.operators) = {
      name: "some"
      arity: ARITY_BINARY
      operands: [OPERAND_COLLECTION_REFERENCE, OPERAND_PREDICATE]
      description:
        "Holds when one element of the collection, the events or links of a span, satisfies the "
        "predicate. Inside the predicate, references to the collection's level bind to that same "
        "element (§5.5)."
    },
    (jaeger.expression.v1.operators) = {
      name: "phrase"
      arity: ARITY_BINARY
      operands: [OPERAND_ATTRIBUTE_REFERENCE, OPERAND_LIST]
      description:
        "Holds when the attribute's value contains every listed word the backend's analyzer "
        "keeps, adjacent and in the listed order, the way a quoted web search does. Text search "
        "matches words, not characters: the backend splits the stored value into words, at least "
        "on ASCII whitespace, ignores ASCII case, and asks whether the listed words occur among "
        "them. The subject is an attribute only, since a built-in field is a short identifier "
        "already searched by `eq` and `regex`. The list is non-empty and of strings, declared or "
        "undeclared, with one word per element: a non-empty run of Unicode letters, combining "
        "marks and digits of at most 255 UTF-16 code units. The caller splits the words, so no "
        "element is a search string with syntax of its own. Everything beyond that is "
        "backend-specific: punctuation between words, case folding and word boundaries beyond "
        "ASCII, splitting of long stored words, stemming, and stop-word removal, so one backend "
        "may stem words that another matches literally and both conform. Whether the position of "
        "a listed word the analyzer drops must be empty or may hold any one word is "
        "backend-specific. See RFC 0005 §5.3, \"Text search\"."
    },
    (jaeger.expression.v1.operators) = {
      name: "fulltext"
      arity: ARITY_BINARY
      operands: [OPERAND_ATTRIBUTE_REFERENCE, OPERAND_LIST]
      description:
        "Holds when the attribute's value contains every listed word the backend's analyzer "
        "keeps, in any order. The operands, how the stored value is split into words, and what "
        "is backend-specific are as for `phrase`. A listed word the analyzer drops constrains "
        "nothing."
    }
  ];

  // args are the operands, and how many an operator takes is a property of op.
  repeated Expression args = 2;
}
